[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "homelab-network-automation"
version = "0.1.0"
description = "iKuai homelab network monitoring and stateful connection automation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31,<3"
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ikuai-cleaner = "ikuai_automation.connection_cleaner:main"
ikuai-monitor = "ikuai_automation.line_monitor:main"
ikuai-notify = "ikuai_automation.feishu_notifier:main"

[tool.setuptools.packages.find]
where = ["src"]
